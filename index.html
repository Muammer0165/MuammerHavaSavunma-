<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muammer | Canlı Hava Durumu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #ffd700;
      letter-spacing: 1px;
    }
    .location {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .temp {
      font-size: 4rem;
      font-weight: 800;
      margin: 10px 0;
    }
    .status {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .details {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 15px;
      margin-top: 15px;
    }
    .detail-item {
      font-size: 0.9rem;
    }
    .detail-item span {
      display: block;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 4px;
    }
    button {
      background: #ffd700;
      color: #1e3c72;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    button:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">MUAMMER WEATHER</div>
    <div class="location" id="city">Konum Alınıyor...</div>
    <div class="temp" id="temp">--°C</div>
    <div class="status" id="status">Canlı Veri Yükleniyor...</div>

    <div class="details">
      <div class="detail-item">
        Rüzgar Hızı
        <span id="wind">-- km/s</span>
      </div>
      <div class="detail-item">
        Nem Oranı
        <span id="humidity">-- %</span>
      </div>
    </div>

    <button onclick="getWeather()">Konumu Yenile</button>
  </div>

  <div class="footer">Kişisel Canlı Hava Durumu Paneli</div>

  <script>
    const weatherCodes = {
      0: "Açık / Güneşli ☀️",
      1: "Çoğunlukla Açık 🌤️",
      2: "Parçalı Bulutlu ⛅",
      3: "Kapalı / Bulutlu ☁️️",
      45: "Sisli 🌫️",
      48: "Yoğun Sis 🌫️",
      51: "Hafif Çiseleyen Yağmur 🌧",
      61: "Yağmurlu 🌧️",
      63: "Orta Şiddetli Yağmur 🌧️",
      65: "Şiddetli Yağmur 🌧️",
      71: "Hafif Kar Yağışlı ❄️",
      73: "Kar Yağışlı ❄️",
      80: "Sağanak Yağmurlu 🌦️",
      95: "Gökgürültülü Fırtına 🌩️"
    };

    function getWeather() {
      document.getElementById('city').innerText = "Konum Alınıyor...";
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`)
            .then(res => res.json())
            .then(data => {
              const current = data.current_weather;
              document.getElementById('temp').innerText = `${Math.round(current.temperature)}°C`;
              document.getElementById('wind').innerText = `${current.windspeed} km/s`;
              document.getElementById('status').innerText = weatherCodes[current.weathercode] || "Açık";
              
              if(data.hourly && data.hourly.relativehumidity_2m) {
                document.getElementById('humidity').innerText = `%${data.hourly.relativehumidity_2m[0]}`;
              }

              fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                .then(res => res.json())
                .then(geoData => {
                  const city = geoData.address.province || geoData.address.city || geoData.address.town || "Bulunduğunuz Konum";
                  const district = geoData.address.suburb || geoData.address.district || "";
                  document.getElementById('city').innerText = district ? `${city}, ${district}` : city;
                })
                .catch(() => {
                  document.getElementById('city').innerText = "Mevcut Konum";
                });
            })
            .catch(() => {
              alert("Hava durumu verisi alınamadı!");
            });
        }, () => {
          alert("Konum izni verilmedi. Varsayılan konum gösteriliyor.");
          fetchWeatherByCoords(37.0, 35.32, "Adana");
        });
      } else {
        alert("Cihazınız konum özelliğini desteklemiyor.");
      }
    }

    function fetchWeatherByCoords(lat, lon, cityName) {
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`)
        .then(res => res.json())
        .then(data => {
          const current = data.current_weather;
          document.getElementById('city').innerText = cityName;
          document.getElementById('temp').innerText = `${Math.round(current.temperature)}°C`;
          document.getElementById('wind').innerText = `${current.windspeed} km/s`;
          document.getElementById('status').innerText = weatherCodes[current.weathercode] || "Açık";
          if(data.hourly && data.hourly.relativehumidity_2m) {
            document.getElementById('humidity').innerText = `%${data.hourly.relativehumidity_2m[0]}`;
          }
        });
    }

    window.onload = getWeather;
  </script>
</body>
</html>
